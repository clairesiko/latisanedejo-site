    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }        :root {
            --marron: #7D6B5C;
            --cream: #F7F3EB;
            --cream-paper: #F2EBD8;
            --sage: #8B9F7A;
            --sage-dark: #6B7F5A;
            --purple: #7B5C8E;
            --purple-dark: #5A4170;
            --purple-light: #9E7EB9;
            --brown: #846055;
            --warm-black: #2C2520;
            --body-text: #6B5B4E;
        }
        body {
            font-family: 'Source Serif 4', serif;
            color: var(--warm-black);
            line-height: 1.65;
            background-color: var(--cream);
            padding-top: 110px;
        }
        a { color: inherit; text-decoration: none; }

        /* === NAV (centered hand-drawn logo + diamond nav) === */
        nav {
            background: #F7F3EB;
            box-shadow: 0 2px 12px rgba(110, 41, 19, 0.08);
            padding: 22px 32px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            justify-content: center;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }
        nav::after {
            content: "";
            position: absolute;
            left: 0; right: 0;
            bottom: -22px;
            height: 22px;
            background: linear-gradient(to bottom, rgba(247,243,235, 0.6), rgba(247,243,235, 0));
            pointer-events: none;
        }
        .nav-logo {
            font-family: 'Source Serif 4', serif;
            font-style: normal;
            font-weight: 800;
            
            font-size: 38px;
            color: var(--purple);
            letter-spacing: -0.5px;
            line-height: 1;
            text-transform: none;
            transition: color 0.3s;
        }
        .nav-logo:hover { color: var(--purple-dark); }
        .nav-links {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-links li {
            display: flex;
            align-items: center;
            list-style: none;
        }
        .nav-links li:not(:first-child)::before {
            content: "\25C6";
            color: var(--brown);
            font-size: 8px;
            opacity: 0.6;
            margin-right: 16px;
            display: inline-block;
        }
        .nav-links a {
            color: var(--brown);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 13px;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--purple); }

        /* === FOOTER === */
        footer {
            background: var(--brown);
            color: var(--cream);
            padding: 0.6rem 2rem;
            text-align: center;
            margin-top: 1.5rem;
        }
        footer > div {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 22px;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }
        footer a {
            color: var(--cream);
            opacity: 0.85;
            transition: color 0.3s, opacity 0.3s;
            margin: 0;
            font-size: 13px;
        }
        footer a:hover { color: var(--purple-light); opacity: 1; }
        footer p {
            font-size: 11px;
            opacity: 0.55;
            letter-spacing: 1px;
            margin-top: 0.2rem;
        }

        /* === PAGE HEADER === */
        .page-header {
            text-align: center;
            padding: 3rem 2rem 2rem;
            max-width: 700px;
            margin: 0 auto;
        }
        .page-header h1 {
            font-family: 'Source Serif 4', serif;
            font-weight: 700;
            font-size: 2.8rem;
            color: var(--brown);
            margin-bottom: 0.8rem;
        }
        .page-header p {
            font-size: 1.1rem;
            color: var(--body-text);
            line-height: 1.7;
        }

        /* === CONTACT FORM === */
        .contact-form {
            max-width: 600px;
            margin: 0 auto 4rem;
            padding: 0 2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1.4rem;
        }
        .form-group label {
            font-family: 'Source Serif 4', serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--brown);
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group textarea {
            font-family: 'Source Serif 4', serif;
            font-size: 1rem;
            color: var(--warm-black);
            background: white;
            border: 1.5px solid #D6C9BA;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--brown);
        }
        .form-group textarea {
            min-height: 140px;
            resize: vertical;
        }
        .btn {
            display: inline-block;
            background-color: var(--purple);
            color: white;
            font-family: 'Source Serif 4', serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            border-radius: 4px;
            padding: 0.85rem 2.5rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 0.5rem;
        }
        .btn:hover { background-color: var(--purple-dark); }

        @media (max-width: 900px) {
            body { padding-top: 100px; }
            nav { padding: 14px 20px 12px; gap: 8px; }
            .nav-logo { font-size: 28px; }
            .nav-links { gap: 12px; flex-wrap: wrap; }
            .nav-links a { font-size: 11px; letter-spacing: 1.5px; }
            .nav-links li:not(:first-child)::before { margin-right: 12px; }
            footer { padding: 0.5rem 1rem; }
        }
        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .page-header p { font-size: 1rem; }
        }
    
        /* Charte 2026 : infos pratiques en Source Sans 3 */
        .nav-links, .nav-links a, footer, footer a, footer p,
        .btn, .btn-buy, .btn-primary, .btn-ghost, .btn-discover,
        .detail-price, .product-price, .product-weight, .page-price,
        .hint, label, input, textarea, .step-dot, .legal-note, .confirm-warning
        { font-family: 'Source Sans 3', sans-serif; }

        /* === TITRES — Insignia Serif (charte : dossier Polices/Titres) === */
        @font-face {
            font-family: 'Insignia Serif';
            src: url('fonts/InsigniaSerifRegular.woff2') format('woff2'),
                 url('fonts/InsigniaSerifRegular.woff') format('woff'),
                 url('fonts/InsigniaSerifRegular.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        h1, h2, h3, h4,
        .page-header h1 {
            font-family: 'Insignia Serif', Georgia, serif !important;
        }
    </style>
</head>

    <main>
        <div class="page-header">
            <h1>Nous contacter</h1>
            <p>Une question, une suggestion ou simplement envie de dire bonjour ? Nous vous répondons avec plaisir.</p>
        </div>

        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="0916cc3c-d545-467c-8a14-0331bb1eb0f2">
            <input type="hidden" name="subject" value="Nouveau message via le site — La Tisane de Jo">
            <input type="hidden" name="botcheck" value="" style="display:none">
            <input type="hidden" name="redirect" value="https://www.latisanedejo.com/contact.html?merci=1">
            <div class="form-group">
                <label for="name">Nom</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">Sujet</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn">Envoyer</button>
        </form>
    </main>

    <footer>
        <div>
            <a href="/">Accueil</a>
            <a href="/#tisanes">Nos Tisanes</a>

            <a href="/faq.html">FAQ</a>
            <a href="/contact.html">Contact</a>
<a href="/retractation.html">Rétractation</a>
            <a href="https://www.instagram.com/latisanedejo/" target="_blank">Instagram</a>
        </div>
        <p>&copy; 2026 La Tisane de Jo. Tous droits réservés.</p>
    </footer>
</body>
